[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Linux-only gtk-rs 0.18 in Tauri; no upgrade path" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 in Tauri plugins; waits on upstream zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 in Tauri plugins; waits on upstream zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 in Tauri plugins; waits on upstream zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
