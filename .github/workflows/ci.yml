name: Verify and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release inputs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and production build
        run: pnpm build
      - name: Run unit tests
        run: |
          pnpm test
          node --test scripts/*.test.mjs
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Preserve browser test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  native:
    name: Native · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Prepare frontend assets for native checks
        run: pnpm build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test providers and core
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native installers
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || github.repository != 'Abulkosim/margin'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":false}}' --ci -- --locked
      - name: Build signed release artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/margin'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Configure the updater signing secret before tagging a release."
            exit 1
          fi
          pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --ci -- --locked
      - name: Collect installers
        env:
          BUILD_TARGET: ${{ matrix.target }}
          SIGNED_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/margin' }}
        run: |
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            node scripts/collect-artifacts.mjs "$BUILD_TARGET" --updater
          else
            node scripts/collect-artifacts.mjs "$BUILD_TARGET"
          fi
      - name: Preserve installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installers-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
      - name: Preserve resolved dependency versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-locks-${{ matrix.target }}
          path: |
            src-tauri/Cargo.lock
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/margin'
    needs: [frontend, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve release asset names
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sbom=sbom/margin-$version.sbom.spdx.json" >> "$GITHUB_OUTPUT"
          mkdir -p sbom
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: installers-*
          path: release-artifacts/
          merge-multiple: true
      - name: Verify updater signatures and generate manifest
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/updater-manifest.mjs release-artifacts "$RELEASE_TAG"
      - name: Generate release checksums
        run: node scripts/checksums.mjs release-artifacts
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_universal.dmg
            release-artifacts/Margin.app.tar.gz
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_x64-setup.exe
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_x64_en-US.msi
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS.txt
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          sbom-path: ${{ steps.assets.outputs.sbom }}
          subject-path: |
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_universal.dmg
            release-artifacts/Margin.app.tar.gz
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_x64-setup.exe
            release-artifacts/Margin_${{ steps.assets.outputs.version }}_x64_en-US.msi
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SBOM_PATH: ${{ steps.assets.outputs.sbom }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to replace assets on a published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Margin $RELEASE_TAG" --notes-file "changelogs/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* "$SBOM_PATH" --clobber

  # Package managers run only on a manual dispatch from a published release tag:
  #   gh workflow run ci.yml --ref vX.Y.Z
  # Draft assets are private, so the cask URL would 404 and winget-releaser refuses drafts.
  # Job-level `if` cannot read `secrets`, so each job is gated on a repository variable and
  # fails fast if the variable is on but its secret is missing.
  homebrew:
    name: Update Homebrew tap
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/margin' && vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Set the HOMEBREW_TAP_TOKEN secret or turn off HOMEBREW_TAP_ENABLED."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abulkosim/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Update and push cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "Publish $RELEASE_TAG before updating the tap."
            exit 1
          fi
          gh release download "$RELEASE_TAG" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          mkdir -p tap/Casks
          [[ -f tap/Casks/margin.rb ]] || cp packaging/homebrew/Casks/margin.rb tap/Casks/margin.rb
          node packaging/homebrew/update-cask.mjs tap/Casks/margin.rb "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt"
          cd tap
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Tap already at ${RELEASE_TAG#v}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/margin.rb
          git commit -m "margin ${RELEASE_TAG#v}"
          git push

  winget:
    name: Publish winget manifest
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/margin' && vars.WINGET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require winget token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "Set the WINGET_TOKEN secret or turn off WINGET_ENABLED."
            exit 1
          fi
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Abulkosim.Margin
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          fork-user: Abulkosim
          token: ${{ secrets.WINGET_TOKEN }}
