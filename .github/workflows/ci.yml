name: Verify and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release inputs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and production build
        run: pnpm build
      - name: Run unit tests
        run: |
          pnpm test
          node --test scripts/*.test.mjs
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Preserve browser test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  native:
    name: Native · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: clippy,rustfmt
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Prepare frontend assets for native checks
        run: pnpm build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test providers and core
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native installers
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') || github.repository != 'Abulkosim/usagebar'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":false}}' --ci -- --locked
      - name: Build signed release artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/usagebar'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Configure the updater signing secret before tagging a release."
            exit 1
          fi
          pnpm tauri build --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --ci -- --locked
      - name: Collect installers
        env:
          BUILD_TARGET: ${{ matrix.target }}
          SIGNED_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/usagebar' }}
        run: |
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            node scripts/collect-artifacts.mjs "$BUILD_TARGET" --updater
          else
            node scripts/collect-artifacts.mjs "$BUILD_TARGET"
          fi
      - name: Preserve installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installers-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
      - name: Preserve resolved dependency versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-locks-${{ matrix.target }}
          path: |
            src-tauri/Cargo.lock
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Abulkosim/usagebar'
    needs: [frontend, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: installers-*
          path: release-artifacts/
          merge-multiple: true
      - name: Verify updater signatures and generate manifest
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/updater-manifest.mjs release-artifacts "$RELEASE_TAG"
      - name: Generate release checksums
        run: node scripts/checksums.mjs release-artifacts
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to replace assets on a published release."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Margin $RELEASE_TAG" --notes-file "changelogs/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
