name: Feature request
description: Suggest a change to how Margin shows Claude or Codex usage.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Margin supports Claude and Codex only, reads OAuth usage APIs only, and never writes CLI credential files. Requests outside that scope will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Margin show or do? Mockups or redacted screenshots help.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Claude, Codex, Both, Not provider-specific]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Both]
    validations:
      required: true
